[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "aviation-data"
version = "0.1.0"
description = "Rights-aware bilingual aviation corpus and grounded QA benchmark pipeline"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Aviation Data Curation Contributors" }]
dependencies = [
  "aiolimiter>=1.2,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0,<7",
  "tenacity>=9.1,<10",
  "transformers>=4.57,<6",
  "typer>=0.16,<1",
]

[project.optional-dependencies]
formats = [
  "mwparserfromhell>=0.7,<1",
  "openpyxl>=3.1,<4",
  "polars>=1.31,<2",
  "pyarrow>=20,<24",
  "pymupdf4llm>=0.0.27,<1",
  "python-docx>=1.2,<2",
  "selectolax>=0.3.29,<1",
]
evaluation = [
  "duckdb>=1.3,<2",
  "rank-bm25>=0.2.2,<1",
]
release = [
  "dvc>=3.60,<4",
]
dev = [
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]
[project.scripts]
aviation-data = "aviation_data.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/aviation_data"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
