name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.9"
          enable-cache: true
      - run: uv python install 3.11.15
      - run: uv sync --frozen --extra dev --extra formats
      - run: uv run ruff format --check src tests
      - run: uv run ruff check src tests
      - run: uv run pytest
      - run: uv run aviation-data rights audit
