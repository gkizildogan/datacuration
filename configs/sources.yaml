    native_format: mixed
    update_cadence: monthly
    version_discovery: publication title, amendment, file URL, and Last-Modified
    bulk_patterns: ["*.xml", "*.zip", "*.pdf"]
    rights:
      state: open
      license_id: LicenseRef-EASA-Reuse
      license_url: https://www.easa.europa.eu/en/easy-access-rules-xml-export
      terms_url: https://www.easa.europa.eu/en/copyright
