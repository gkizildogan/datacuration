  - source_id: wikipedia_en_dump
    enabled: false
    adapter: wikimedia_dump
    seed_urls: ["https://dumps.wikimedia.org/enwiki/"]
    publisher: Wikimedia Foundation and Wikipedia contributors
    source_family: wikipedia
    authority_level: community_reference
    languages: [en]
    topics: [regulation, airlines, airports, aircraft, engines, operations, safety, general_aviation]
    expected_mime_types: [application/x-bzip2, application/xml]
    native_format: xml
    update_cadence: release_snapshot
    version_discovery: multistream dump index and dumpstatus.json
    bulk_patterns: ["pages-articles-multistream*.xml*.bz2", "pages-articles-multistream-index*.txt*.bz2"]
    rights:
      state: open
      license_id: CC-BY-SA-4.0
      license_url: https://creativecommons.org/licenses/by-sa/4.0/
      terms_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      reviewed_on: 2026-07-29
      attribution: Wikipedia contributors; preserve page title, revision ID, URL, and history attribution.
      release_source: true
      release_derived_text: true
      release_qa: true

