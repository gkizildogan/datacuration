  # Bounded alternatives to the disabled full dumps above. These entries use
  # the read-only Action API and acquire one revision-pinned article per record.
  - source_id: wikipedia_en_aviation_api
    enabled: true
    adapter: mediawiki_api
    seed_urls: ["https://en.wikipedia.org/w/api.php"]
    publisher: Wikimedia Foundation and Wikipedia contributors
    source_family: wikipedia
    authority_level: community_reference
    languages: [en]
    topics: [aircraft, engines, general_aviation]
    expected_mime_types: [text/html]
    native_format: html
    update_cadence: frozen_snapshot
    version_discovery: latest revision IDs from bounded category and title queries
    selectors:
      content: .mw-parser-output
    requests_per_second: 1.0
    concurrency: 1
    max_bytes: 5242880
    mediawiki:
      page_titles:
        - Aircraft engine
        - Aerodynamics
      category_titles:
        - "Category:Aircraft engines"
        - "Category:Aircraft aerodynamics"
      max_pages: 150
      max_total_bytes: 268435456
      batch_size: 20
      maxlag: 5
    rights:
      state: open
      license_id: CC-BY-SA-4.0
      license_url: https://creativecommons.org/licenses/by-sa/4.0/
      terms_url: https://foundation.wikimedia.org/wiki/Policy:Terms_of_Use
      reviewed_on: 2026-07-29
      attribution: Wikipedia contributors; preserve page title, revision ID, permanent URL, and history URL.
      release_source: true
      release_derived_text: true
      release_qa: true

  - source_id: wikipedia_tr_airlines_api
